<div class="admin-products-page">

  <!-- Header -->
  <div class="header">
    <a routerLink="/admin/ad-home" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i> Retour
    </a>
    <h2>Tous les produits</h2>
    <p class="subtitle">Gérez vos produits facilement</p>
  </div>

  <!-- Table des produits -->
  <div class="table-container" *ngIf="data && data.length > 0; else noProducts">
    <table class="products-table">
      <thead>
        <tr>
          <th>Nom</th>
          <th>Prix</th>
          <th>Référence</th>
          <th>Voir</th>
          <th>Supprimer</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of data">
          <td>{{ product.name }}</td>
          <td>{{ product.price | currency:'FCFA' }}</td>
          <td>{{ product.pr_uid }}</td>
          <td>
            <button class="btn-view" (click)="viewsingleProducts(product.pr_uid)">
              <i class="fa-solid fa-eye"></i>
            </button>
          </td>
          <td>
            <button class="btn-delete" (click)="deleteProduct(product.pr_uid)">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <ng-template #noProducts>
    <div class="no-products">
      <p>Aucun produit trouvé.</p>
    </div>
  </ng-template>

</div>
