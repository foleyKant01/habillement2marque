<div class="product-update-page">

  <!-- HEADER -->
  <div class="header">
    <a routerLink="/admin/view-all-products/" class="back">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <div>
      <h2>Modifier le produit</h2>
      <p>Gérez et mettez à jour les informations</p>
    </div>
  </div>

  <div class="content">

    <!-- LEFT : INFOS PRODUIT -->
    <div class="product-card" *ngIf="product">
      <img [src]="product.image_file[0]" alt="product">

      <h3>{{ product.name }}</h3>
      <span class="type">{{ product.type }}</span>

      <p class="desc">{{ product.description }}</p>

      <div class="info">
        <div><strong>Prix:</strong> {{ product.price }} FCFA</div>
        <div><strong>Stock:</strong> {{ product.inventory_level }}</div>
        <div><strong>Couleur:</strong> {{ product.color }}</div>
        <div><strong>Réf:</strong> {{ product.pr_uid }}</div>
      </div>
    </div><br>

    <!-- RIGHT : FORM -->
    <form 
      (submit)="updateProducts()" 
      [formGroup]="updateProductsForm"
      class="form-card"
      [ngClass]="{'blur': loading}"
    >

      <h3>Modifier</h3>

      <div class="form-group">
        <label>Nom</label>
        <input formControlName="name" type="text">
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea formControlName="description"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Prix</label>
          <input formControlName="price" type="text">
        </div>

        <div class="form-group">
          <label>Stock</label>
          <input formControlName="inventory_level" type="text">
        </div>
      </div>

      <div class="form-group">
        <label>Couleur</label>
        <input formControlName="color" type="text">
      </div>

      <div class="form-group">
        <label>Pointure</label>
        <input formControlName="pointure" type="text">
      </div>

      <div class="form-group">
        <label>Style</label>
        <input formControlName="style" type="text">
      </div>

      <div class="form-group">
        <label>Matière</label>
        <input formControlName="material" type="text">
      </div>

      <div class="form-group">
        <label>Image</label>
        <input formControlName="image" type="file">
      </div>
      <button type="submit" class="btn">
        Mettre à jour
      </button>

    </form>

  </div>

  <!-- LOADING -->
  <app-spinner *ngIf="loading" class="overlay"></app-spinner>

  <!-- SUCCESS -->
  <div *ngIf="success" class="success-msg">
    Produit mis à jour avec succès ✅
  </div>

</div>
