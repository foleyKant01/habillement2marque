<div class="login-container">
  <div class="login-card">

    <!-- Logo -->
    <div class="logo">
      <img src="assets/logo.png" alt="Trouvez Tous">
    </div>

    <!-- Title -->
    <h2>Administration</h2>
    <p class="subtitle">Connectez-vous pour continuer</p>

    <form [formGroup]="loginuser" (ngSubmit)="Loginadmin()">

      <div class="form-group">
        <label>Adresse email</label>
        <input
          type="email"
          class="form-control"
          formControlName="ad_email"
          placeholder="ex: admin@site.com">
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input
          type="password"
          class="form-control"
          formControlName="ad_password"
          placeholder="••••••••">
      </div>

      <div class="actions">
        <a routerLink="/auth/forgotpassword" class="forgot">
          Mot de passe oublié ?
        </a>
      </div>

      <button type="submit" class="btn-login">
        Se connecter
      </button>

    </form>

  </div>

  <div class="copyright">
    <small>© 2026 — Trouvez Tous. Tous droits réservés.</small>
  </div>
</div>
